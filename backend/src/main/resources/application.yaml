spring:
  application:
    name: geovia

  datasource:
    url: jdbc:postgresql://localhost:5432/geovia
    username: geovia
    password: geovia

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

app:
  auth:
    base-url: ${APP_BASE_URL:http://localhost:5173}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  mail:
    from: ${MAIL_FROM:no-reply@geovia.local}
  storage:
    avatar-directory: ${AVATAR_STORAGE_DIR:./data/avatars}
